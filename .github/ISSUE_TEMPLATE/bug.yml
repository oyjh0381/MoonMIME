name: Bug report
description: Report a reproducible parser, decoder, or CLI defect
title: "[bug] "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential mail. Replace it with the smallest synthetic reproducer.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact MimeError code or diagnostic when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Synthetic input
      description: Use escaped bytes when line endings or non-UTF-8 octets matter.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MoonMIME and MoonBit versions
    validations:
      required: true
