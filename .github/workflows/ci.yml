name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - name: Resolve dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check every supported target
        run: moon check --target all --deny-warn
      - name: Test portable core
        run: |
          moon test --target wasm-gc --deny-warn
          moon test --target wasm --deny-warn
          moon test --target js --deny-warn
      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code

  native-linux:
    name: Native CLI (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon update
      - name: Native tests and build
        run: |
          moon test --target native --deny-warn
          moon build --target native --deny-warn
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.8'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/oracles/package-lock.json
      - name: Independent oracles and separate consumer
        run: |
          npm ci --prefix scripts/oracles --ignore-scripts --no-audit --no-fund
          python scripts/validate.py --skip-resources
      - name: CLI smoke tests
        run: |
          moon run --target native cmd/moonmime -- version
          moon run --target native cmd/moonmime -- inspect examples/sample.eml --compatible --json
          moon run --target native cmd/moonmime -- text examples/sample.eml --compatible
          moon run --target native cmd/moonmime -- attachments examples/sample.eml --compatible
          moon run --target native cmd/moonmime -- audit security-corpus/attack_conflicting_content_type.eml --compatible --json
          bash scripts/evaluate-security-corpus.sh
          bash scripts/verify-integrations.sh

  native-windows:
    name: Native CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon update
      - name: Native tests, build, and CLI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon test --target native --deny-warn
          moon build --target native --deny-warn
          moon run --target native cmd/moonmime -- version
          moon run --target native cmd/moonmime -- inspect examples\sample.eml --compatible --json
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\evaluate-security-corpus.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-integrations.ps1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon update
      - name: Generate API documentation
        run: moon doc
      - name: Validate repository links and whitespace
        run: |
          test -f README.md
          test -f README.mbt.md
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          git diff --check
